<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Swap Request</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title">Shift Swap Request</h1>
    <p id="description">Please complete the form below to request a shift swap.</p>

    <form id="survey-form">
        <fieldset>
            <label id="name-label">
                Enter your full name:
                <input id="name" type="text" required placeholder="Your full name">
            </label>

            <label id="email-label">
                Enter your email:
                <input id="email" type="email" required placeholder="Your email">
            </label>

            <label id="number-label">
                Enter the nurse's name you want to swap with:
                <input id="swap-nurse" type="text" required placeholder="Nurse name">
            </label>

            <label>
                Phone Number (Optional):
                <input id="phone" type="tel" placeholder="Your phone number">
            </label>
        </fieldset>

        <hr>

        <fieldset>
            <label>
                Select the day of the week:
                <select id="dropdown" required>
                    <option value="">Select an option</option>
                    <option>Monday</option>
                    <option>Tuesday</option>
                    <option>Wednesday</option>
                    <option>Thursday</option>
                    <option>Friday</option>
                    <option>Saturday</option>
                    <option>Sunday</option>
                </select>
            </label>

            <p>Which shift would you like to swap?</p>

            <label class="radio-btn">
                <input type="radio" name="shift" value="morning" required> Morning (7am - 3pm)
            </label>

            <label class="radio-btn">
                <input type="radio" name="shift" value="evening"> Evening (3pm - 11pm)
            </label>

            <label class="radio-btn">
                <input type="radio" name="shift" value="night"> Night (11pm - 7am)
            </label>

            <hr id="line-2">

            <textarea rows="5" cols="30" placeholder="Please explain the reason for the shift swap request"></textarea>

            <input type="submit" value="Submit Request" id="submit">
        </fieldset>
    </form>
</body>
</html>
