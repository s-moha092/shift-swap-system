<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 id="title">Manager Dashboard</h1>
    <p id="description">Review and approve shift swap requests</p>

    <div id="survey-form">

        <div class="request-box">
            <p><strong>Nurse:</strong> John Doe</p>
            <p><strong>Swap With:</strong> Jane Smith</p>
            <p><strong>Day:</strong> Monday</p>
            <p><strong>Shift:</strong> Morning</p>

            <button class="approve">Approve</button>
            <button class="reject">Reject</button>
        </div>

    </div>

</body>
</html>
