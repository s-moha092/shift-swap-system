<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Shift Swap System - Login</title>
</head>
<body>
    <div class="overlay">
        <div class="login-box">
            <div class="login-header">
                <h1>Shift Swap System</h1>
                <p>Nurse and Manager Portal</p>
            </div>

            <div class="input-box">
                <input type="text" class="input-field" placeholder="Employee ID" autocomplete="off" required>
            </div>

            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
            </div>

            <div class="forgot">
                <section>
                    <input type="checkbox" class="check" id="remember">
                    <label for="remember">Remember me</label>
                </section>
                <section>
                    <a href="#">Forgot password?</a>
                </section>
            </div>

            <a href="shifts.html" class="sign-in-link">
                <div class="input-submit">
                    <button class="submit-btn" id="submit">Sign In</button>
                </div>
            </a>

            <div class="sign-up-link">
                <p>Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
